<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ClassSight — Attendance and Behaviour</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap">
<script>
  // Apply the saved theme before first paint so the page never flashes the wrong colours.
  (function () {
    try {
      var saved = JSON.parse(localStorage.getItem('classsight.v2') || '{}');
      var t = (saved.settings && saved.settings.theme) || 'light';
      if (t === 'system') t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
    } catch (e) { /* storage blocked: keep light */ }
  })();
</script>
<style>
:root {
  color-scheme: light;
  --bg: #F4F5F7;
  --surface: #FFFFFF;
  --surface-2: #F8F9FA;
  --surface-3: #EEF0F3;
  --border: #DFE3E8;
  --border-strong: #C5CCD5;
  --text: #18202D;
  --text-2: #465163;
  --text-3: #616B7A;
  --accent: #1F5AA6;
  --accent-hover: #184B8C;
  --accent-weak: #E9F0F9;
  --on-accent: #FFFFFF;
  --ok: #1E7A4C;
  --ok-weak: #E6F3EC;
  --bad: #B3362F;
  --bad-weak: #FAEAE8;
  --warn: #8A5700;
  --warn-weak: #FBF1DE;
  --chart-1: #2a78d6;
  --chart-2: #eb6834;
  --grid: #E6E9EE;
  --shadow-pop: 0 10px 30px rgba(16, 24, 40, 0.16);
  --radius: 6px;
  --radius-lg: 8px;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0F1318;
  --surface: #161B22;
  --surface-2: #1B212A;
  --surface-3: #222A34;
  --border: #2A323D;
  --border-strong: #3A4452;
  --text: #E5E9EF;
  --text-2: #B1BAC6;
  --text-3: #8A94A2;
  --accent: #6FA3E6;
  --accent-hover: #8AB5EC;
  --accent-weak: #1B2A3E;
  --on-accent: #0E1A2B;
  --ok: #4FBF86;
  --ok-weak: #16291F;
  --bad: #EE7A70;
  --bad-weak: #2E1A19;
  --warn: #E3AD4A;
  --warn-weak: #2C2414;
  --chart-1: #3987e5;
  --chart-2: #d95926;
  --grid: #262E38;
  --shadow-pop: 0 10px 30px rgba(0, 0, 0, 0.5);
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font: 400 14px/1.5 "Public Sans", system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3 { margin: 0; color: var(--text); font-weight: 600; }
h1 { font-size: 20px; line-height: 1.3; letter-spacing: -0.01em; }
h2 { font-size: 15px; line-height: 1.4; }
h3 { font-size: 14px; line-height: 1.4; }
p { margin: 0; }
a { color: var(--accent); text-decoration-thickness: 1px; text-underline-offset: 2px; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num, .tab { font-variant-numeric: tabular-nums; }
.muted { color: var(--text-3); }
.small { font-size: 12.5px; }
.nowrap { white-space: nowrap; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
[hidden] { display: none !important; }

/* ---------- Shell ---------- */
.app { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 100vh; }
.sidebar {
  position: sticky; top: 0; height: 100vh;
  display: flex; flex-direction: column;
  padding: 16px 12px;
  background: var(--surface);
  border-right: 1px solid var(--border);
}
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 18px; }
.brand-mark {
  width: 30px; height: 30px; border-radius: 7px;
  background: var(--accent); color: var(--on-accent);
  display: grid; place-items: center;
  font-weight: 700; font-size: 12.5px; letter-spacing: 0.02em;
}
.brand-name { font-weight: 700; font-size: 15px; line-height: 1.2; }
.brand-sub { font-size: 12px; color: var(--text-3); line-height: 1.2; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav a {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 10px; border-radius: var(--radius);
  color: var(--text-2); text-decoration: none; font-weight: 500;
}
.nav a svg { width: 18px; height: 18px; flex: none; }
.nav a > span:not(.nav-badge) { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nav a:hover { background: var(--surface-3); color: var(--text); }
.nav a[aria-current="page"] { background: var(--accent-weak); color: var(--accent); }
.nav-badge {
  margin-left: auto; flex: none; font-size: 11px; font-weight: 600;
  padding: 1px 6px; border-radius: 999px;
  background: var(--bad-weak); color: var(--bad);
}
.nav-badge.cam { background: var(--surface-3); color: var(--text-2); }
.sidebar-foot { margin-top: auto; padding: 12px 8px 0; border-top: 1px solid var(--border); display: grid; gap: 10px; }
.who { font-size: 13px; line-height: 1.35; }
.who .muted { font-size: 12px; }
.theme-btn {
  display: inline-flex; align-items: center; gap: 8px;
  background: none; border: 1px solid var(--border); border-radius: var(--radius);
  padding: 6px 10px; cursor: pointer; color: var(--text-2); font-size: 13px; width: 100%;
}
.theme-btn:hover { border-color: var(--border-strong); color: var(--text); }
.theme-btn svg { width: 16px; height: 16px; }

.main { min-width: 0; display: flex; flex-direction: column; }
.topbar {
  display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;
  padding: 18px 32px 16px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
}
.topbar .sub { color: var(--text-3); font-size: 13px; margin-top: 2px; }
.subject-picker { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-2); }
.subject-picker select { min-width: 220px; max-width: 320px; }
.page { padding: 24px 32px 56px; width: 100%; max-width: 1400px; }
.page:focus { outline: none; }

/* ---------- Controls ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 34px; padding: 6px 14px;
  border-radius: var(--radius); border: 1px solid transparent;
  font-weight: 600; font-size: 13.5px; line-height: 1.2;
  cursor: pointer; text-decoration: none; white-space: nowrap;
}
.btn svg { width: 16px; height: 16px; }
.btn:disabled { opacity: 0.55; cursor: not-allowed; }
.btn-primary { background: var(--accent); color: var(--on-accent); }
.btn-primary:hover:not(:disabled) { background: var(--accent-hover); }
.btn-secondary { background: var(--surface); color: var(--text); border-color: var(--border-strong); }
.btn-secondary:hover:not(:disabled) { background: var(--surface-3); }
.btn-ghost { background: transparent; color: var(--text-2); }
.btn-ghost:hover:not(:disabled) { background: var(--surface-3); color: var(--text); }
.btn-danger { background: var(--bad); color: #fff; }
:root[data-theme="dark"] .btn-danger { color: #1A0D0C; }
.btn-danger:hover:not(:disabled) { filter: brightness(0.95); }
.btn-danger-outline { background: var(--surface); color: var(--bad); border-color: var(--border-strong); }
.btn-danger-outline:hover:not(:disabled) { background: var(--bad-weak); }
.btn-sm { min-height: 28px; padding: 3px 10px; font-size: 12.5px; }
.link-btn { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; font-weight: 500; }
.link-btn:hover { text-decoration: underline; }
.link-btn.danger { color: var(--bad); }
.icon-btn {
  display: inline-grid; place-items: center; width: 30px; height: 30px;
  border: 0; border-radius: var(--radius); background: transparent; color: var(--text-3); cursor: pointer;
}
.icon-btn:hover { background: var(--surface-3); color: var(--text); }
.icon-btn svg { width: 18px; height: 18px; }

.input, .select, textarea.input {
  height: 34px; padding: 6px 10px;
  background: var(--surface); color: var(--text);
  border: 1px solid var(--border-strong); border-radius: var(--radius);
}
textarea.input { height: auto; min-height: 120px; resize: vertical; line-height: 1.45; font-variant-numeric: tabular-nums; }
.select { padding-right: 28px; }
.select-sm { height: 28px; padding: 2px 24px 2px 8px; font-size: 12.5px; }
.input:hover, .select:hover { border-color: var(--text-3); }
.input:focus, .select:focus, textarea.input:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: var(--accent); }
.input[aria-invalid="true"] { border-color: var(--bad); }
.field { display: grid; gap: 5px; margin-bottom: 14px; }
.field > label, .field-label { font-weight: 600; font-size: 13px; color: var(--text); }
.field-hint { font-size: 12.5px; color: var(--text-3); }
.field-error { font-size: 12.5px; color: var(--bad); min-height: 0; }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.check { display: inline-flex; align-items: center; gap: 7px; cursor: pointer; font-size: 13.5px; color: var(--text-2); user-select: none; }
.check input { width: 16px; height: 16px; margin: 0; accent-color: var(--accent); }
.check.disabled { opacity: 0.55; cursor: not-allowed; }
.checklist { display: grid; gap: 6px; padding: 8px 10px; border: 1px solid var(--border); border-radius: var(--radius); max-height: 180px; overflow: auto; }
.range-row { display: grid; grid-template-columns: 1fr 64px; gap: 12px; align-items: center; }
.range-row input[type="range"] { width: 100%; accent-color: var(--accent); }
.range-row output { text-align: right; font-variant-numeric: tabular-nums; color: var(--text-2); }

.field .seg { justify-self: start; }
.seg { display: inline-flex; border: 1px solid var(--border-strong); border-radius: var(--radius); overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: transparent; padding: 5px 12px; font-size: 13px; font-weight: 500; color: var(--text-2); cursor: pointer; }
.seg button + button { border-left: 1px solid var(--border-strong); }
.seg button[aria-pressed="true"] { background: var(--accent-weak); color: var(--accent); font-weight: 600; }

/* ---------- Panels, stats, tables ---------- */
.panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); min-width: 0; }
.panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.panel-head p { color: var(--text-3); font-size: 13px; }
.panel-body { padding: 16px; }
.panel-note { padding: 10px 16px; border-top: 1px solid var(--border); color: var(--text-3); font-size: 12.5px; }
.stack { display: grid; gap: 20px; }
.grid-2 { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 20px; align-items: start; }
.grid-2-even { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; align-items: start; }

.subject-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
.subject-head h2 { font-size: 18px; }
.subject-head p { color: var(--text-3); margin-top: 2px; }
.head-actions { display: flex; gap: 8px; flex-wrap: wrap; }

.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); margin-bottom: 20px; }
.stat { padding: 14px 18px; min-width: 0; }
.stat + .stat { border-left: 1px solid var(--border); }
.stat-label { font-size: 13px; color: var(--text-2); }
.stat-value { font-size: 24px; font-weight: 600; line-height: 1.25; margin-top: 4px; font-variant-numeric: tabular-nums; }
.stat-note { font-size: 12.5px; color: var(--text-3); margin-top: 2px; }
.stat-value.bad { color: var(--bad); }

.table-wrap { overflow-x: auto; position: relative; }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 9px 16px; border-bottom: 1px solid var(--border); vertical-align: middle; }
th { font-size: 12.5px; font-weight: 600; color: var(--text-3); background: var(--surface-2); white-space: nowrap; }
tbody tr:last-child td { border-bottom: 0; }
tbody tr:hover td { background: var(--surface-2); }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
td .sub { display: block; font-size: 12.5px; color: var(--text-3); }
.row-actions { display: flex; gap: 12px; justify-content: flex-end; white-space: nowrap; }
.matrix th, .matrix td { padding: 7px 10px; text-align: center; }
.matrix th:first-child, .matrix td:first-child, .matrix th:nth-child(2), .matrix td:nth-child(2) { text-align: left; }
.matrix td.cell-P { color: var(--ok); font-weight: 600; }
.matrix td.cell-L { color: var(--warn); font-weight: 600; }
.matrix td.cell-A { color: var(--bad); font-weight: 600; }
.matrix td.cell-none { color: var(--text-3); }

.pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border-radius: 999px; font-size: 12.5px; font-weight: 600; white-space: nowrap; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill-ok { background: var(--ok-weak); color: var(--ok); }
.pill-bad { background: var(--bad-weak); color: var(--bad); }
.pill-warn { background: var(--warn-weak); color: var(--warn); }
.pill-neutral { background: var(--surface-3); color: var(--text-2); }
.pill-plain::before { display: none; }
.tag { display: inline-block; padding: 0 6px; border-radius: 4px; font-size: 11.5px; font-weight: 600; background: var(--surface-3); color: var(--text-2); vertical-align: 1px; }

.list { list-style: none; margin: 0; padding: 0; }
.list li { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--border); }
.list li:last-child { border-bottom: 0; }
.list .grow { flex: 1; min-width: 0; }
.list .name { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.avatar { width: 32px; height: 32px; border-radius: 50%; flex: none; display: grid; place-items: center; background: var(--surface-3); color: var(--text-2); font-size: 12px; font-weight: 600; overflow: hidden; }
.avatar img { width: 100%; height: 100%; object-fit: cover; }

.empty { text-align: center; padding: 48px 24px; }
.empty h2 { font-size: 17px; margin-bottom: 6px; }
.empty p { color: var(--text-3); max-width: 520px; margin: 0 auto 18px; }
.empty .head-actions { justify-content: center; }
.empty-inline { padding: 22px 16px; color: var(--text-3); font-size: 13.5px; }
.notice { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; padding: 10px 14px; border: 1px solid var(--border); border-left: 3px solid var(--accent); border-radius: var(--radius); background: var(--surface); margin-bottom: 18px; font-size: 13.5px; }
.notice.warn { border-left-color: var(--warn); }
.notice.bad { border-left-color: var(--bad); }

.toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
.toolbar .spacer { flex: 1; }
.search { width: 260px; max-width: 100%; }

.back { display: inline-flex; align-items: center; gap: 4px; margin-bottom: 14px; font-size: 13.5px; text-decoration: none; }
.back svg { width: 16px; height: 16px; }
.back:hover { text-decoration: underline; }

dl.facts { display: grid; grid-template-columns: max-content 1fr; gap: 6px 18px; margin: 0; }
dl.facts dt { color: var(--text-3); }
dl.facts dd { margin: 0; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }

/* ---------- Live session ---------- */
.live-toolbar { display: flex; gap: 12px 20px; align-items: center; flex-wrap: wrap; padding: 10px 14px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); margin-bottom: 16px; }
.tb-group { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.tb-right { margin-left: auto; }
.session-meta { font-size: 13px; color: var(--text-2); display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.live-grid { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 20px; align-items: start; }
.stage { position: relative; aspect-ratio: 16 / 9; background: #0D1117; border-radius: var(--radius-lg); overflow: hidden; border: 1px solid var(--border); }
.stage video, .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; display: block; }
.stage video.mirrored { transform: scaleX(-1); }
.stage-msg { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px; color: #C9D1DB; }
.stage-msg .inner { max-width: 440px; display: grid; gap: 12px; justify-items: center; }
.stage-msg h2 { color: #F0F3F6; font-size: 16px; }
.stage-msg p { color: #AEB8C4; font-size: 13.5px; }
.stage-msg.error h2 { color: #FFB4AC; }
.stage-status { display: flex; gap: 6px 18px; flex-wrap: wrap; padding: 8px 2px 16px; font-size: 12.5px; color: var(--text-3); font-variant-numeric: tabular-nums; }
.stage-status b { font-weight: 600; color: var(--text-2); }
.live-side { display: grid; gap: 16px; }
.register .panel-head { border-bottom: 0; padding-bottom: 8px; }
.register .seg { margin: 0 16px 10px; }
.reg-list { list-style: none; margin: 0; padding: 0; max-height: 62vh; overflow: auto; border-top: 1px solid var(--border); }
.reg-list li { display: flex; align-items: center; gap: 10px; padding: 8px 16px; border-bottom: 1px solid var(--border); transition: background-color 0.6s ease; }
.reg-list li:last-child { border-bottom: 0; }
.reg-list li.flash { background: var(--ok-weak); }
.reg-name { flex: 1; min-width: 0; line-height: 1.3; }
.reg-name .name { display: block; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.reg-name .sub { font-size: 12px; color: var(--text-3); }
.reg-status { text-align: right; display: grid; justify-items: end; gap: 2px; }
.reg-status .when { font-size: 11.5px; color: var(--text-3); font-variant-numeric: tabular-nums; }
.status-select.st-present { color: var(--ok); font-weight: 600; }
.status-select.st-late { color: var(--warn); font-weight: 600; }
.status-select.st-absent { color: var(--text-2); }
.review-item { display: flex; gap: 10px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--border); }
.review-item:last-child { border-bottom: 0; }
.review-item img { width: 48px; height: 48px; border-radius: var(--radius); object-fit: cover; flex: none; background: var(--surface-3); }
.review-item .grow { flex: 1; min-width: 0; line-height: 1.35; }
.review-item .btns { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }

/* ---------- Charts ---------- */
.chart-box { width: 100%; min-height: 40px; }
.chart { display: block; width: 100%; height: auto; font-family: inherit; overflow: visible; }
.chart .grid-line { stroke: var(--grid); stroke-width: 1; }
.chart .axis-text { fill: var(--text-3); font-size: 11px; }
.chart .label-text { fill: var(--text-2); font-size: 12px; }
.chart .ref-line { stroke: var(--text-3); stroke-width: 1; opacity: 0.7; }
.chart .ref-text { fill: var(--text-3); font-size: 11px; }
.chart .s1-line { stroke: var(--chart-1); stroke-width: 2; fill: none; stroke-linejoin: round; stroke-linecap: round; }
.chart .s1-fill { fill: var(--chart-1); }
.chart .s2-fill { fill: var(--chart-2); }
.chart .dot { stroke: var(--surface); stroke-width: 2; }
.chart .connector { stroke: var(--border-strong); stroke-width: 2; }
.chart .hit { fill: transparent; cursor: default; }
.chart .row:hover .row-bg { opacity: 1; }
.chart .row-bg { fill: var(--surface-2); opacity: 0; }
.legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12.5px; color: var(--text-2); margin-bottom: 8px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.legend i.s1 { background: var(--chart-1); }
.legend i.s2 { background: var(--chart-2); }
.barlist { display: grid; gap: 8px; }
.barlist .row { display: grid; grid-template-columns: minmax(110px, 180px) minmax(0, 1fr) 48px; gap: 12px; align-items: center; font-size: 13px; }
.barlist .label { color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.barlist .track { height: 14px; background: var(--surface-3); border-radius: 0 4px 4px 0; }
.barlist .fill { height: 100%; background: var(--chart-1); border-radius: 0 4px 4px 0; min-width: 2px; }
.barlist .val { text-align: right; font-variant-numeric: tabular-nums; color: var(--text); }
.tip {
  position: fixed; z-index: 60; pointer-events: none;
  max-width: 280px; padding: 7px 10px; border-radius: var(--radius);
  background: var(--text); color: var(--surface); font-size: 12.5px; line-height: 1.4;
  box-shadow: var(--shadow-pop); white-space: pre-line;
}

/* ---------- Dialogs and toasts ---------- */
dialog.dialog {
  width: min(520px, calc(100vw - 32px)); max-height: calc(100vh - 48px);
  padding: 0; border: 1px solid var(--border); border-radius: 10px;
  background: var(--surface); color: var(--text); box-shadow: var(--shadow-pop);
}
dialog.dialog-wide { width: min(680px, calc(100vw - 32px)); }
dialog::backdrop { background: rgba(15, 19, 24, 0.45); }

<script>

const LOCALE = 'en-IN';
const fmtDate = ts => new Date(ts).toLocaleDateString(LOCALE, { day: 'numeric', month: 'short', year: 'numeric' });
const fmtDateShort = ts => new Date(ts).toLocaleDateString(LOCALE, { day: 'numeric', month: 'short' });

  return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
const csvRow = arr => arr.map(csvCell).join(',');
function parseCsv(text) {
  const rows = [];
  let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; }
      else cell += c;
    } else if (c === '"') q = true;
    else if (c === ',') { row.push(cell); cell = ''; }
    else if (c === '\n' || c === '\r') {
      if (c === '\r' && text[i + 1] === '\n') i++;
      row.push(cell); rows.push(row); row = []; cell = '';
    } else cell += c;
  }
  if (cell !== '' || row.length) { row.push(cell); rows.push(row); }

}
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };

/* ---------------- Storage ---------------- */
const Store = {
  state: null,
  _timer: null,
  load() {
    let raw = null;
    try { raw = localStorage.getItem(STORAGE_KEY); } catch (e) { this.blocked = true; }
    this.state = defaultState();
    if (raw) {
      try { this.state = normalizeState(JSON.parse(raw)); }
      catch (e) {
        this.loadError = true;
        try { localStorage.setItem(STORAGE_KEY + '.unreadable', raw); } catch (_) { /* ignore */ }
      }
    }
  },
  save() {
    clearTimeout(this._timer);
    this._timer = null;
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(this.state));
      return true;
    } catch (e) {
      toast('Changes could not be saved: browser storage is full or blocked. Export a backup from Settings.', 'error');
      return false;
    }
  },
  saveSoon() {
    if (this._timer) return;
    this._timer = setTimeout(() => this.save(), 700);
  },
  flush() { if (this._timer) this.save(); }
};
function normalizeState(p) {
  const d = defaultState();
  const s = Object.assign({}, d, p || {});
  s.settings = Object.assign({}, d.settings, (p && p.settings) || {});
  s.profile = Object.assign({}, d.profile, (p && p.profile) || {});
  s.labels = Array.isArray(s.labels) && s.labels.length ? s.labels.map(String) : d.labels;
  s.results = s.results && Array.isArray(s.results.overall) && Array.isArray(s.results.perClass) ? s.results : d.results;
  s.subjects = Array.isArray(s.subjects) ? s.subjects.filter(x => x && x.id) : [];
  s.students = (Array.isArray(s.students) ? s.students : []).filter(x => x && x.id).map(st => Object.assign({}, st, {
    subjectIds: Array.isArray(st.subjectIds) ? st.subjectIds : [],
    faces: Array.isArray(st.faces) ? st.faces.filter(f => f && Array.isArray(f.d) && f.d.length === 128) : []
  }));
  s.sessions = (Array.isArray(s.sessions) ? s.sessions : []).filter(x => x && x.id).map(se => Object.assign({}, se, {
    records: se.records && typeof se.records === 'object' ? se.records : {},
    events: Array.isArray(se.events) ? se.events : [],
    review: Array.isArray(se.review) ? se.review : []
  }));
  if (s.liveSessionId && !s.sessions.some(x => x.id === s.liveSessionId && !x.endedAt)) s.liveSessionId = null;
  return s;
}
const S = () => Store.state;

const Files = {
  open() {
    return new Promise((resolve, reject) => {
      if (!window.indexedDB) return reject(new Error('IndexedDB is not available'));
      const req = indexedDB.open(IDB_NAME, 1);
      req.onupgradeneeded = () => req.result.createObjectStore(IDB_STORE);
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  },
  async run(mode, fn) {
    const db = await this.open();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(IDB_STORE, mode);
      const store = tx.objectStore(IDB_STORE);
      let result;
      const req = fn(store);
      if (req) req.onsuccess = () => { result = req.result; };
      tx.oncomplete = () => { db.close(); resolve(result); };
      tx.onerror = () => { db.close(); reject(tx.error); };
      tx.onabort = () => { db.close(); reject(tx.error || new Error('Storage transaction aborted')); };
    });
  },
  get(key) { return this.run('readonly', st => st.get(key)); },
  put(key, value) { return this.run('readwrite', st => st.put(value, key)); },
  del(key) { return this.run('readwrite', st => st.delete(key)); }
};

/* ---------------- Data queries ---------------- */
const subjectById = id => S().subjects.find(x => x.id === id) || null;

const sessionById = id => S().sessions.find(x => x.id === id) || null;
function activeSubject() {
  let s = subjectById(S().activeSubjectId);
  if (!s && S().subjects.length) { s = S().subjects[0]; S().activeSubjectId = s.id; }
  return s;
}
const byRoll = (a, b) => a.roll.localeCompare(b.roll, undefined, { numeric: true, sensitivity: 'base' });
const studentsIn = sid => S().students.filter(st => st.subjectIds.includes(sid)).sort(byRoll);
const sessionsOf = sid => S().sessions.filter(x => x.subjectId === sid).sort((a, b) => b.startedAt - a.startedAt);
function liveSession() {
  const id = S().liveSessionId;
  const se = id ? sessionById(id) : null;
  return se && !se.endedAt ? se : null;
}
function liveSubject() {
  const se = liveSession();
  return se ? subjectById(se.subjectId) : activeSubject();
}
function counts(se) {
  let present = 0, late = 0, absent = 0;
  for (const id of Object.keys(se.records)) {
    const st = se.records[id].status;
    if (st === 'present') present++; else if (st === 'late') late++; else absent++;
  }
  const total = present + late + absent;
  return { present, late, absent, total, attended: present + late, rate: total ? (present + late) / total * 100 : null };
}
function studentAttendance(stId, sid) {
  let held = 0, attended = 0;
  for (const se of S().sessions) {
    if (se.subjectId !== sid || !se.endedAt) continue;
    const r = se.records[stId];
    if (!r) continue;
    held++;
    if (r.status !== 'absent') attended++;
  }
  return { held, attended, pct: held ? attended / held * 100 : null };
}
function labelName(cls) {
  const l = S().labels[cls];
  return l && l.trim() ? l.trim() : 'class_' + cls;
}
function ensureLabelCount(n) {
  const labels = S().labels;
  if (labels.length < n) for (let i = labels.length; i < n; i++) labels.push('class_' + i);
}
function displayClassName(name, index) {
  // Results keep the training names (class_0 ...). Show the renamed label when one exists.
  const m = /^class_(\d+)$/.exec(name);
  const i = m ? Number(m[1]) : index;
  const l = S().labels[i];
  return l && l !== name ? l + ' (' + name + ')' : name;
}

};

    const used = new Set();
    for (const p of pairs) {
      if (p.d >= thr + margin) break;
      if (p.f.sid || used.has(p.st.id)) continue;
      p.f.sid = p.st.id;
      p.f.name = p.st.name;
      p.f.d = p.d;
      p.f.kind = p.d < thr ? 'match' : 'possible';
      used.add(p.st.id);
    }
    this.assignTracks(faces, now);
    const se = liveSession();
    for (const f of faces) {
      if (settings.cues && f.lm && f.lm.length >= 68) f.cues = this.cuesFor(f, now);
      if (f.kind === 'match') {
        this.seen[f.sid] = (this.seen[f.sid] || 0) + 1;
        if (se) this.tryMark(se, f);
      } else if (f.kind === 'possible' && se) {
        this.maybeReview(se, f);
      }
      if (se) for (const c of f.cues) {
        this.logEvent(se, { sid: f.kind === 'match' ? f.sid : null, key: f.kind === 'match' ? 'S' + f.sid : 'T' + f.track.id, label: c, source: 'face', score: null }, now);
      }
    }
    this.faces = faces;
    this.renderStatus();
  },
  assignTracks(faces, now) {
    for (const t of this.tracks) t.claimed = false;
    for (const f of faces) {
      const cx = f.box.x + f.box.w / 2, cy = f.box.y + f.box.h / 2;
      let best = null, bestD = Infinity;
      for (const t of this.tracks) {
        if (t.claimed) continue;
        const d = Math.hypot(t.cx - cx, t.cy - cy);
        if (d < Math.max(f.box.w, 40) * 0.75 && d < bestD) { best = t; bestD = d; }
      }
      if (!best) { best = { id: this.nextTrack++, opens: [], open: false, awaySince: null }; this.tracks.push(best); }
      best.claimed = true; best.cx = cx; best.cy = cy; best.last = now;
      f.track = best;
    }
    this.tracks = this.tracks.filter(t => now - t.last < 3000);
  },
  // Simple, explainable cues from 68 facial landmarks. They are prompts, not judgements.
  cuesFor(f, now) {
    const p = f.lm, t = f.track, cues = [];
    const le = p[36], re = p[45], nose = p[30];
    const eyeDist = Math.hypot(re.x - le.x, re.y - le.y) || 1;
    const yaw = (nose.x - (le.x + re.x) / 2) / eyeDist;
    if (Math.abs(yaw) > 0.25) { if (t.awaySince == null) t.awaySince = now; }
    else t.awaySince = null;
    if (t.awaySince != null && now - t.awaySince > 1500) cues.push('Looking away');
    const mouthW = Math.hypot(p[54].x - p[48].x, p[54].y - p[48].y) || 1;
    const mar = Math.hypot(p[66].x - p[62].x, p[66].y - p[62].y) / mouthW;
    if (!t.open && mar > 0.25) { t.open = true; t.opens.push(now); }
    else if (t.open && mar < 0.12) t.open = false;
    t.opens = t.opens.filter(x => now - x < 3000);
    if (t.opens.length >= 2) cues.push('Speaking');
    return cues;
  },
  tryMark(se, f) {
    if (!se.records[f.sid]) se.records[f.sid] = { status: 'absent', at: null, method: null };
    const r = se.records[f.sid];
    if (r.status !== 'absent' || r.method === 'manual') return;
    if ((this.seen[f.sid] || 0) < Number(S().settings.framesToMark)) return;
    const late = Date.now() - se.startedAt > Number(S().settings.lateAfterMin) * 60000;
    se.records[f.sid] = { status: late ? 'late' : 'present', at: Date.now(), method: 'face', score: round(1 - f.d) };
    const pending = se.review.find(x => x.sid === f.sid && x.state === 'pending');
    if (pending) pending.state = 'resolved';
    Store.saveSoon();
    this.renderRegister(f.sid);
    this.renderReview();
    this.renderSessionCtrl();
    updateNav();
  },
  maybeReview(se, f) {
    const r = se.records[f.sid];
    if (r && r.status !== 'absent') return;
    if (se.review.some(x => x.sid === f.sid)) return;
    se.review.push({ id: uid(), sid: f.sid, score: round(1 - f.d), at: Date.now(), crop: cropFace(this.video, f.box), state: 'pending' });
    Store.saveSoon();
    this.renderReview();
  },
  logEvent(se, e, now) {
    const key = e.key + '|' + e.label;
    const cooldown = Number(S().settings.cooldownSec) * 1000;
    if (this.lastEvent[key] && now - this.lastEvent[key] < cooldown) return;
    this.lastEvent[key] = now;
    se.events.push({ at: Date.now(), sid: e.sid, label: e.label, source: e.source, score: e.score });
    if (se.events.length > 3000) se.events.splice(0, se.events.length - 3000);
    Store.saveSoon();
    this.renderLog();
  },
  associate(dets) {
    for (const d of dets) {
      let best = null, bestD = Infinity;
      for (const f of this.faces) {
        const cx = f.box.x + f.box.w / 2, cy = f.box.y + f.box.h / 2;
        if (cx < d.x1 || cx > d.x2 || cy < d.y1 || cy > d.y2) continue;
        const dist = Math.hypot(cx - d.cx, cy - d.y1) - (f.kind === 'match' ? 10000 : 0);
        if (dist < bestD) { best = f; bestD = dist; }
      }
      d.sid = best && best.kind === 'match' ? best.sid : null;
      d.name = d.sid ? best.name : null;
    }
  },

  /* ----- drawing ----- */
  startDraw() {
    cancelAnimationFrame(this.raf);
    const step = () => { this.draw(); this.raf = requestAnimationFrame(step); };
    this.raf = requestAnimationFrame(step);
  },
  clearOverlay() {
    const c = $('#overlay');
    if (c && c.width) c.getContext('2d').clearRect(0, 0, c.width, c.height);
  },
  draw() {
    const c = $('#overlay');
    if (!c) return;
    const v = this.video;
    if (!this.stream || !v || !v.videoWidth) { this.clearOverlay(); return; }
    if (c.width !== v.videoWidth || c.height !== v.videoHeight) { c.width = v.videoWidth; c.height = v.videoHeight; }
    const ctx = c.getContext('2d');
    const W = c.width;
    ctx.clearRect(0, 0, W, c.height);
    const s = Math.max(1, W / 700);
    const mirror = !!S().settings.mirror;
    const X = (x, w) => (mirror ? W - x - w : x);
    for (const d of this.dets) {
      const w = d.x2 - d.x1, h = d.y2 - d.y1, x = X(d.x1, w);
      strokeBox(ctx, x, d.y1, w, h, OVERLAY.behaviour, s, false);
      chip(ctx, d.label + ' ' + Math.round(d.score * 100) + '%', x, d.y1, OVERLAY.behaviour, s, 'above', W);
    }
    for (const f of this.faces) {
      const x = X(f.box.x, f.box.w);
      const color = OVERLAY[f.kind];
      strokeBox(ctx, x, f.box.y, f.box.w, f.box.h, color, s, f.kind === 'possible');
      let text = 'Unknown';
      if (f.kind === 'match') text = f.name;
      else if (f.kind === 'possible') text = 'Possible: ' + f.name;
      chip(ctx, text, x, f.box.y, color, s, 'above', W);
      let y = f.box.y + f.box.h + 3 * s;
      for (const cue of f.cues) { y = chip(ctx, cue, x, y, '#2F3A48', s, 'below', W); }
    }
  },

  /* ----- session ----- */
  startSession() {
    const subj = liveSubject();
    if (!subj) return;
    if (liveSession()) return;
    const students = studentsIn(subj.id);
    const records = {};
    for (const st of students) records[st.id] = { status: 'absent', at: null, method: null };
    const se = { id: uid(), subjectId: subj.id, startedAt: Date.now(), endedAt: null, records, events: [], review: [] };
    S().sessions.push(se);
    S().liveSessionId = se.id;
    S().activeSubjectId = subj.id;
    this.seen = {};
    this.lastEvent = {};
    Store.save();
    toast('Session started for ' + subj.code + '.');
    if (!students.length) toast('No students are enrolled in ' + subj.code + '. Add students to take attendance.', 'error');
    else if (!students.some(st => st.faces.length)) toast('No enrolled student has face samples yet, so attendance must be marked by hand.');
    if (!this.stream) this.startCamera();
    this.updateAll();
  },
  async endSession() {
    const se = liveSession();
    if (!se) return;
    const c = counts(se);
    const pending = se.review.filter(x => x.state === 'pending').length;
    const ok = await confirmDialog({
      title: 'End this session?',
      message: c.attended + ' of ' + c.total + ' students are marked present or late. Students not marked are recorded as absent.' + (pending ? ' ' + plural(pending, 'possible match') + ' still need review; they will be recorded as absent.' : ''),
      confirmLabel: 'End session'
    });
    if (!ok || !liveSession()) return;
    se.endedAt = Date.now();
    S().liveSessionId = null;
    for (const r of se.review) if (r.state === 'pending') r.state = 'expired';
    Store.save();
    toast('Session ended. ' + c.attended + ' of ' + c.total + ' present.');
    this.updateAll();
  },
  setStatus(sid, status) {
    const se = liveSession();
    if (!se) return;
    const prev = se.records[sid] || {};
    se.records[sid] = status === 'absent'
      ? { status: 'absent', at: null, method: 'manual' }
      : { status, at: prev.at && prev.status !== 'absent' ? prev.at : Date.now(), method: 'manual' };
    Store.save();
    this.renderRegister(sid);
    this.renderSessionCtrl();
  },
  resolveReview(id, confirm) {
    const se = liveSession();
    if (!se) return;
    const item = se.review.find(x => x.id === id);
    if (!item || item.state !== 'pending') return;
    item.state = confirm ? 'confirmed' : 'dismissed';
    if (confirm) {
      const late = Date.now() - se.startedAt > Number(S().settings.lateAfterMin) * 60000;
      se.records[item.sid] = { status: late ? 'late' : 'present', at: Date.now(), method: 'review', score: item.score };
    }
    Store.save();
    this.renderReview();
    this.renderRegister(item.sid);
    this.renderSessionCtrl();
  },

  onPage() { return App.view === 'live' && !!$('#stage'); },
  mount() {

  renderSessionCtrl() {
    const el = $('#session-ctrl');

      const c = counts(se);
      el.innerHTML = '<div class="session-meta"><span class="pill pill-bad">In progress</span><span>Started ' + fmtTime(se.startedAt) + '</span><span class="num"><b>' + c.attended + '</b> of ' + c.total + ' present</span></div>' +
        '<button type="button" class="btn btn-danger-outline" data-action="session-end">End session</button>';

  renderStatus() {
    const el = $('#stage-status');
    if (!el) return;
    const v = this.video;
    const parts = [];
    parts.push('<span>Camera <b>' + (this.stream && v.videoWidth ? v.videoWidth + '×' + v.videoHeight : 'off') + '</b></span>');
    let faceText = 'off';
    if (this.faceOn) {
      if (FaceLib.status === 'loading') faceText = 'loading models';
      else if (FaceLib.status === 'error') faceText = 'unavailable';
      else if (this.stream && this.running.face) faceText = this.faces.length + ' in view, ' + this.fps.face.toFixed(1) + ' fps';
      else faceText = 'ready';
    }

    let behText = 'off';

    else if (this.behaviourOn && this.running.beh) behText = this.dets.length + ' detected, ' + this.fps.beh.toFixed(1) + ' fps';
    else if (!Model.session && Model.status !== 'saved') behText = 'no model loaded';
    parts.push('<span>Behaviour model <b>' + esc(behText) + '</b></span>');
    const pool = this.matchPool().length;
    parts.push('<span>Students with face samples <b>' + pool + '</b></span>');
    el.innerHTML = parts.join('');
    if (FaceLib.status === 'error' && this.faceOn) el.insertAdjacentHTML('beforeend', '<span style="color:var(--bad)">' + esc(FaceLib.error) + '</span>');
  },
  renderRegister(flashId) {
    const list = $('#register');
    if (!list) return;
    const subj = liveSubject();
    const se = liveSession();
    const students = subj ? studentsIn(subj.id) : [];
    let shown = students;
    if (se && this.filter !== 'all') {
      shown = students.filter(st => {
        const r = se.records[st.id];
        const attended = r && r.status !== 'absent';
        return this.filter === 'present' ? attended : !attended;
      });
    }
    const count = $('#reg-count');
    if (count) {
      if (se) { const c = counts(se); count.textContent = c.attended + ' of ' + c.total + ' present'; }
      else count.textContent = plural(students.length, 'student');
    }
    $$('#reg-filter button').forEach(b => { b.setAttribute('aria-pressed', String(b.dataset.filter === this.filter)); b.disabled = !se; });
    if (!students.length) {
      list.innerHTML = '<li class="empty-inline">No students in ' + esc(subj ? subj.code : 'this subject') + '. <a href="#/students">Add students</a></li>';
      return;
    }
    if (!shown.length) { list.innerHTML = '<li class="empty-inline">No students match this filter.</li>'; return; }
    list.innerHTML = shown.map(st => {
      const avatar = '<span class="avatar">' + (st.photo ? '<img src="' + esc(st.photo) + '" alt="">' : esc(initials(st.name))) + '</span>';
      let right;
      if (se) {
        const r = se.records[st.id] || { status: 'absent' };
        const when = r.status !== 'absent' && r.at ? methodText(r.method) + ', ' + fmtTime(r.at) : '';
        right = '<select class="select select-sm status-select st-' + r.status + '" data-change="set-status" data-sid="' + esc(st.id) + '" aria-label="Attendance for ' + esc(st.name) + '">' +
          ['present', 'late', 'absent'].map(v => '<option value="' + v + '"' + (r.status === v ? ' selected' : '') + '>' + STATUS_TEXT[v] + '</option>').join('') +
          '</select>' + (when ? '<span class="when">' + esc(when) + '</span>' : '');
      } else {
        right = st.faces.length ? '<span class="muted small">' + plural(st.faces.length, 'sample') + '</span>' : '<span class="pill pill-warn pill-plain">No face samples</span>';
      }
      return '<li data-sid="' + esc(st.id) + '"' + (flashId === st.id ? ' class="flash"' : '') + '>' + avatar +
        '<span class="reg-name"><span class="name">' + esc(st.name) + '</span><span class="sub num">' + esc(st.roll) + '</span></span>' +
        '<span class="reg-status">' + right + '</span></li>';
    }).join('');
    if (flashId) setTimeout(() => { const li = list.querySelector('li.flash'); if (li) li.classList.remove('flash'); }, 1600);
  },
  renderReview() {
    const panel = $('#review-panel');
    if (!panel) return;
    const se = liveSession();
    const items = se ? se.review.filter(x => x.state === 'pending') : [];
    panel.hidden = !items.length;
    if (!items.length) return;
    $('#review-list').innerHTML = items.map(it => {
      const st = studentById(it.sid);
      return '<div class="review-item">' + (it.crop ? '<img src="' + esc(it.crop) + '" alt="Face seen by the camera">' : '<span class="avatar">?</span>') +
        '<div class="grow"><div><b>' + esc(st ? st.name : 'Removed student') + '</b></div><div class="small muted num">' + esc(st ? st.roll : '') + ', match score ' + Math.round(it.score * 100) + '%</div></div>' +
        '<div class="btns"><button type="button" class="btn btn-sm btn-primary" data-action="review-confirm" data-id="' + esc(it.id) + '">Confirm</button>' +
        '<button type="button" class="btn btn-sm btn-secondary" data-action="review-dismiss" data-id="' + esc(it.id) + '">Dismiss</button></div></div>';
    }).join('');
    $('#review-count').textContent = String(items.length);
  },
  renderLog() {
    const el = $('#action-log');
    if (!el) return;
    const se = liveSession();
    const countEl = $('#log-count');
    if (!se) {
      el.innerHTML = '<p class="empty-inline">Start a session to record observed actions. Labels still show on the video while the camera is on.</p>';
      if (countEl) countEl.textContent = '';
      return;
    }
    if (countEl) countEl.textContent = plural(se.events.length, 'observation');
    if (!se.events.length) { el.innerHTML = '<p class="empty-inline">No actions observed yet in this session.</p>'; return; }
    el.innerHTML = eventsTable(se.events.slice(-80).reverse());
  }
};
function ema(prev, x) { return prev ? prev * 0.8 + x * 0.2 : x; }
function cameraErrorText(e) {
  const n = e && e.name;
  if (n === 'NotAllowedError' || n === 'SecurityError') return 'Camera access was blocked. Allow camera access for this page in the browser\'s site settings, then try again.';
  if (n === 'NotFoundError' || n === 'OverconstrainedError') return 'No camera was found. Connect a camera, then try again.';
  if (n === 'NotReadableError' || n === 'AbortError') return 'The camera is in use by another app. Close that app, then try again.';
  return 'The camera could not be started (' + ((e && e.message) || n || 'unknown error') + ').';
}
const STATUS_TEXT = { present: 'Present', late: 'Late', absent: 'Absent' };
function methodText(m) { return { face: 'Face', review: 'Confirmed', manual: 'Manual' }[m] || 'Manual'; }
function strokeBox(ctx, x, y, w, h, color, s, dashed) {
  ctx.save();
  ctx.lineWidth = 2 * s;
  ctx.strokeStyle = color;
  if (dashed) ctx.setLineDash([6 * s, 4 * s]);
  ctx.strokeRect(x, y, w, h);
  ctx.restore();
}
// Draws a text label with a solid background. Returns the y below it (for stacking).
function chip(ctx, text, x, y, bg, s, place, W) {
  const fs = Math.round(13 * s);
  ctx.font = '600 ' + fs + 'px "Public Sans", system-ui, sans-serif';
  const padX = 6 * s, h = fs + 8 * s;
  const w = ctx.measureText(text).width + padX * 2;
  let ry;
  if (place === 'above') ry = y - h - 2 * s < 0 ? y + 2 * s : y - h - 2 * s;
  else if (place === 'inside-top') ry = y + 2 * s;
  else ry = y;
  const rx = clamp(x, 0, Math.max(0, W - w));
  ctx.fillStyle = bg;
  ctx.fillRect(rx, ry, w, h);
  ctx.fillStyle = '#FFFFFF';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, rx + padX, ry + h / 2 + 0.5);
  return ry + h + 2 * s;
}
function eventsTable(events) {
  return '<div class="table-wrap"><table><thead><tr><th>Time</th><th>Student</th><th>Action</th><th>Source</th><th class="num">Confidence</th></tr></thead><tbody>' +
    events.map(ev => {
      const st = ev.sid ? studentById(ev.sid) : null;
      return '<tr><td class="nowrap tab">' + fmtTimeSec(ev.at) + '</td><td>' + (st ? esc(st.name) + '<span class="sub num">' + esc(st.roll) + '</span>' : '<span class="muted">Not identified</span>') + '</td>' +
        '<td>' + esc(ev.label) + '</td><td>' + (ev.source === 'model' ? 'Behaviour model' : 'Face cue') + '</td><td class="num">' + (ev.score != null ? Math.round(ev.score * 100) + '%' : '—') + '</td></tr>';
    }).join('') + '</tbody></table></div>';
}

/* =====================================================================
   Charts (inline SVG, no library)
   ===================================================================== */
function lineChart(points, target, width) {
  const W = Math.max(300, Math.round(width || 720)), H = 250, m = { l: 44, r: target != null ? 100 : 20, t: 16, b: 34 };
  const iw = W - m.l - m.r, ih = H - m.t - m.b;
  const n = points.length;
  const x = i => m.l + (n === 1 ? iw / 2 : i * iw / (n - 1));
  const y = v => m.t + ih - clamp(v, 0, 100) / 100 * ih;
  let g = '';
  for (const t of [0, 25, 50, 75, 100]) {
    g += '<line class="grid-line" x1="' + m.l + '" x2="' + (W - m.r) + '" y1="' + y(t) + '" y2="' + y(t) + '"/>';
    g += '<text class="axis-text" x="' + (m.l - 8) + '" y="' + (y(t) + 4) + '" text-anchor="end">' + t + '%</text>';
  }
  if (target != null) {
    g += '<line class="ref-line" x1="' + m.l + '" x2="' + (W - m.r) + '" y1="' + y(target) + '" y2="' + y(target) + '"/>';
    g += '<text class="ref-text" x="' + (W - m.r + 8) + '" y="' + (y(target) + 4) + '">' + target + '% requirement</text>';
  }
  const step = Math.max(1, Math.ceil(n / Math.max(2, Math.floor(iw / 72))));
  points.forEach((p, i) => {
    if (i % step === 0 || i === n - 1) g += '<text class="axis-text" x="' + x(i) + '" y="' + (H - 10) + '" text-anchor="middle">' + esc(p.label) + '</text>';
  });
  if (n > 1) g += '<path class="s1-line" d="' + points.map((p, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(p.value).toFixed(1)).join(' ') + '"/>';
  points.forEach((p, i) => {
    g += '<circle class="s1-fill dot" cx="' + x(i) + '" cy="' + y(p.value) + '" r="4.5"/>';
  });
  points.forEach((p, i) => {
    g += '<circle class="hit" cx="' + x(i) + '" cy="' + y(p.value) + '" r="14" data-tip="' + esc(p.tip) + '"/>';
  });
  return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Attendance percentage by session">' + g + '</svg>';
}
function dumbbellChart(rows, width) {
  const vals = rows.flatMap(r => [r.base, r.prop]).filter(v => typeof v === 'number' && !isNaN(v));
  const lo = Math.max(0, Math.min(0.6, Math.floor((Math.min.apply(null, vals) - 0.02) * 10) / 10));
  const hi = 1;
  const W = Math.max(300, Math.round(width || 720));
  const rowH = 30, m = { l: Math.min(190, Math.round(W * 0.34)), r: 24, t: 8, b: 30 };
  const maxChars = Math.max(8, Math.floor((m.l - 16) / 7));
  const H = m.t + rows.length * rowH + m.b;
  const iw = W - m.l - m.r;
  const x = v => m.l + (clamp(v, lo, hi) - lo) / (hi - lo) * iw;
  let g = '';
  for (let t = lo; t <= hi + 1e-9; t += 0.1) {
    const tv = round(t, 1);
    g += '<line class="grid-line" x1="' + x(tv) + '" x2="' + x(tv) + '" y1="' + m.t + '" y2="' + (H - m.b) + '"/>';
    g += '<text class="axis-text" x="' + x(tv) + '" y="' + (H - 10) + '" text-anchor="middle">' + tv.toFixed(1) + '</text>';
  }
  rows.forEach((r, i) => {
    const cy = m.t + i * rowH + rowH / 2;
    const tip = r.label + '\nBaseline ' + r.base.toFixed(3) + '\nProposed ' + r.prop.toFixed(3) + ' (' + (r.prop - r.base >= 0 ? '+' : '') + (r.prop - r.base).toFixed(3) + ')';
    g += '<g class="row"><rect class="row-bg" x="0" y="' + (cy - rowH / 2) + '" width="' + W + '" height="' + rowH + '"/>';
    g += '<text class="label-text" x="' + (m.l - 12) + '" y="' + (cy + 4) + '" text-anchor="end">' + esc(r.label.length > maxChars ? r.label.slice(0, maxChars - 1) + '…' : r.label) + '</text>';
    g += '<line class="connector" x1="' + x(r.base) + '" x2="' + x(r.prop) + '" y1="' + cy + '" y2="' + cy + '"/>';
    g += '<circle class="s2-fill dot" cx="' + x(r.base) + '" cy="' + cy + '" r="5"/>';
    g += '<circle class="s1-fill dot" cx="' + x(r.prop) + '" cy="' + cy + '" r="5"/>';
    g += '<rect class="hit" x="0" y="' + (cy - rowH / 2) + '" width="' + W + '" height="' + rowH + '" data-tip="' + esc(tip) + '"/></g>';
  });
  return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="AP at 0.5 IoU per class, baseline compared with proposed">' + g + '</svg>';
}
// Charts are drawn at the real pixel width of their box so text stays at its set size.
const Charts = {
  slots: [],
  slot(fn) { this.slots.push(fn); return '<div class="chart-box" data-chart-index="' + (this.slots.length - 1) + '"></div>'; },
  draw() {
    for (const el of $$('[data-chart-index]')) {
      const fn = this.slots[Number(el.dataset.chartIndex)];
      if (fn) el.innerHTML = fn(el.clientWidth);
    }
  }
};
function barList(rows) {
  const max = Math.max(1, ...rows.map(r => r.value));
  return '<div class="barlist">' + rows.map(r =>
    '<div class="row" data-tip="' + esc(r.label + ': ' + r.value) + '"><span class="label">' + esc(r.label) + '</span>' +
    '<span class="track"><span class="fill" style="display:block;width:' + (r.value / max * 100).toFixed(1) + '%"></span></span>' +
    '<span class="val">' + r.value + '</span></div>').join('') + '</div>';
}
function countLabels(events) {
  const map = new Map();
  for (const e of events) map.set(e.label, (map.get(e.label) || 0) + 1);
  return Array.from(map, ([label, value]) => ({ label, value })).sort((a, b) => b.value - a.value);
}

async function removeSubject(id) {
  const s = subjectById(id);
  if (!s) return;
  const live = liveSession();
  if (live && live.subjectId === id) { toast('End the live session for ' + s.code + ' before removing it.', 'error'); return; }
  const n = sessionsOf(id).length;
  const ok = await confirmDialog({
    title: 'Remove ' + s.code + '?',
    message: 'This removes the subject and its ' + plural(n, 'session') + ', including their attendance and observations. Students stay in the roster and keep their other subjects. This cannot be undone.',
    confirmLabel: 'Remove subject', danger: true
  });
  if (!ok) return;
  S().subjects = S().subjects.filter(x => x.id !== id);
  S().sessions = S().sessions.filter(x => x.subjectId !== id);
  for (const st of S().students) st.subjectIds = st.subjectIds.filter(x => x !== id);
  if (S().activeSubjectId === id) S().activeSubjectId = S().subjects[0] ? S().subjects[0].id : null;
  Store.save();
  toast(s.code + ' removed.');
  render();
}

async function removeStudent(id) {
  const st = studentById(id);
  if (!st) return;
  const ok = await confirmDialog({
    title: 'Remove ' + st.name + '?',
    message: 'This removes the student, their face samples and their attendance in every session. This cannot be undone.',
    confirmLabel: 'Remove student', danger: true
  });
  if (!ok) return;
  S().students = S().students.filter(x => x.id !== id);
  for (const se of S().sessions) {
    delete se.records[id];
    for (const ev of se.events) if (ev.sid === id) ev.sid = null;
    se.review = se.review.filter(x => x.sid !== id);
  }
  delete Live.seen[id];
  Store.save();
  toast(st.name + ' removed.');
  render();

function enrollFace(id) {
  const st = studentById(id);
  if (!st) return;
  let cancelled = false, busy = false, startedHere = false;
  const d = openDialog({
    title: 'Face samples for ' + st.name,
    body:
      '<div class="enroll-stage"><video id="enroll-video" autoplay muted playsinline></video></div>' +
      '<p class="enroll-msg" id="enroll-msg" role="status">Starting camera…</p>' +
      '<p class="muted small">Sit facing the camera in good light, with only this student in view. Three samples are taken about a second apart; turn the head slightly between them. Saved samples: <b class="num" id="enroll-count">' + st.faces.length + '</b> of 6.</p>',
    actions: [
      { label: 'Clear samples', id: 'enroll-clear', kind: 'ghost', left: true, onClick: async () => {
        if (!st.faces.length) return;
        const ok = await confirmDialog({ title: 'Clear face samples?', message: 'The camera will no longer recognise ' + st.name + ' until new samples are captured.', confirmLabel: 'Clear samples', danger: true });
        if (!ok) return;
        st.faces = []; st.photo = null; Store.save(); updateCount(); msg('Samples cleared. Capture new ones when ready.'); refreshAfterEnroll();
      } },
      { label: 'Done', onClick: dd => dd.close() },
      { label: 'Capture 3 samples', id: 'enroll-go', kind: 'primary', submit: true, onClick: () => capture() }
    ],
    onClose: () => { cancelled = true; if (startedHere && App.view !== 'live' && !liveSession()) Live.stopCamera(); }
  });
  const goBtn = d.querySelector('#enroll-go');
  goBtn.disabled = true;
  const msg = t => { const el = d.querySelector('#enroll-msg'); if (el) el.textContent = t; };
  const updateCount = () => { const el = d.querySelector('#enroll-count'); if (el) el.textContent = String(st.faces.length); };
  const v = d.querySelector('#enroll-video');
  (async () => {
    if (!Live.stream) {
      const ok = await Live.startCamera();
      if (cancelled) return;
      if (!ok) { msg(Live.error || 'The camera could not be started.'); return; }
      startedHere = true;
    }
    v.srcObject = Live.stream;
    try { await v.play(); } catch (_) { /* ignore */ }
    msg('Loading face models…');
    const ok = await FaceLib.ensure();
    if (cancelled) return;
    if (!ok) { msg(FaceLib.error); return; }
    msg('Ready. Select Capture 3 samples.');
    goBtn.disabled = false;
  })();
  async function capture() {
    if (busy || cancelled || FaceLib.status !== 'ready') return;
    busy = true; goBtn.disabled = true;
    const samples = [];
    let attempts = 0, photo = null;
    while (samples.length < 3 && attempts < 18 && !cancelled) {
      attempts++;
      await sleep(samples.length ? 900 : 300);
      if (cancelled) return;
      let r = null;
      try { r = await FaceLib.detectOne(v); } catch (e) { console.error(e); }
      if (!r) { msg('No face found. Move closer, face the camera and check the lighting. Sample ' + (samples.length + 1) + ' of 3.'); continue; }
      if (r.detection.score < 0.6) { msg('The face is not clear enough. Hold still and face the camera. Sample ' + (samples.length + 1) + ' of 3.'); continue; }
      const desc = Array.from(r.descriptor, x => Math.round(x * 1e4) / 1e4);
      const clash = nearestStudent(desc, S().students.filter(x => x.faces.length), st.id);
      if (clash && clash.d < Number(S().settings.matchThreshold)) {
        msg('This face matches ' + clash.st.name + ' (' + clash.st.roll + '), so the samples were not saved. Make sure the right student is in front of the camera.');
        busy = false; goBtn.disabled = false;
        return;
      }
      samples.push({ d: desc, at: Date.now() });
      if (!photo) photo = cropFace(v, boxOf(r));
      msg('Sample ' + samples.length + ' of 3 captured.');
    }
    if (cancelled) return;
    if (!samples.length) msg('No samples were captured. Check the lighting and try again.');
    else {
      st.faces = st.faces.concat(samples).slice(-6);
      if (photo) st.photo = photo;
      Store.save();
      updateCount();
      msg(plural(samples.length, 'sample') + ' saved. ' + st.name + ' can now be recognised.');
      toast('Face samples saved for ' + st.name + '.');
      refreshAfterEnroll();
    }
    busy = false; goBtn.disabled = false;
  }
}

function loadSample() {
  if (S().subjects.some(x => x.sample)) { toast('Sample data is already loaded.'); return; }
  const rnd = mulberry32(20261013);
  const names = ['Aarav Sharma', 'Diya Patel', 'Vihaan Iyer', 'Ananya Reddy', 'Kabir Nair', 'Ishita Rao', 'Arjun Menon', 'Saanvi Gupta',
    'Reyansh Pillai', 'Myra Joshi', 'Vivaan Desai', 'Anika Verma', 'Aditya Kulkarni', 'Kiara Bose', 'Sai Krishnan', 'Navya Chatterjee',
    'Dhruv Malhotra', 'Riya Kapoor', 'Arnav Bhat', 'Zara Khan', 'Yash Agarwal', 'Tara Chauhan', 'Ved Mishra', 'Anaya Trivedi'];
  const subjects = [
    { id: uid(), code: 'CS-302', name: 'Artificial Intelligence', section: 'A', room: '402', createdAt: Date.now(), sample: true },
    { id: uid(), code: 'CS-305', name: 'Computer Networks', section: 'A', room: '305', createdAt: Date.now(), sample: true }
  ].filter(s => !S().subjects.some(x => x.code.toLowerCase() === s.code.toLowerCase()));
  if (!subjects.length) { toast('Subjects CS-302 and CS-305 already exist, so sample data was not added.', 'error'); return; }
  const students = [];
  names.forEach((name, i) => {
    const roll = '22CS' + String(i + 1).padStart(3, '0');
    if (S().students.some(x => x.roll.toLowerCase() === roll.toLowerCase())) return;
    students.push({ id: uid(), roll, name, subjectIds: subjects.map(s => s.id), faces: [], photo: null, createdAt: Date.now(), sample: true, rate: 0.55 + rnd() * 0.43 });
  });
  const sessions = [];
  const day = 86400000;
  subjects.forEach((subj, si) => {
    const count = si === 0 ? 10 : 6;
    let t = new Date(); t.setHours(si === 0 ? 10 : 14, 0, 0, 0);
    let back = 1;
    for (let k = 0; k < count; k++) {
      let dt;
      do { dt = new Date(t.getTime() - back * day); back++; } while (dt.getDay() === 0 || dt.getDay() === 6);
      const start = dt.getTime();
      const records = {}, events = [];
      for (const st of students) {
        const x = rnd();
        const status = x < st.rate ? (rnd() < 0.12 ? 'late' : 'present') : 'absent';
        records[st.id] = { status, at: status === 'absent' ? null : start + Math.floor((status === 'late' ? 11 + rnd() * 15 : rnd() * 8) * 60000), method: status === 'absent' ? null : 'face', score: status === 'absent' ? null : round(0.55 + rnd() * 0.3) };
        if (status !== 'absent') {
          const n = Math.floor(rnd() * 4);
          for (let e = 0; e < n; e++) {
            const cls = Math.floor(rnd() * 8);
            events.push({ at: start + Math.floor(rnd() * 50 * 60000), sid: st.id, label: rnd() < 0.75 ? labelName(cls) : (rnd() < 0.5 ? 'Looking away' : 'Speaking'), source: 'model', score: round(0.45 + rnd() * 0.5) });
          }
        }
      }
      events.sort((a, b) => a.at - b.at);
      for (const e of events) if (e.label === 'Looking away' || e.label === 'Speaking') { e.source = 'face'; e.score = null; }
      sessions.push({ id: uid(), subjectId: subj.id, startedAt: start, endedAt: start + 50 * 60000, records, events, review: [], sample: true });
    }
  });
  students.forEach(st => { delete st.rate; });
  S().subjects.push(...subjects);
  S().students.push(...students);
  S().sessions.push(...sessions);
  if (!activeSubject() || !subjectById(S().activeSubjectId)) S().activeSubjectId = subjects[0].id;
  if (!S().subjects.some(x => !x.sample)) S().activeSubjectId = subjects[0].id;
  Store.save();
  toast('Sample data loaded: ' + plural(subjects.length, 'subject') + ', ' + plural(students.length, 'student') + ', ' + plural(sessions.length, 'session') + '.');
  render();
}
async function removeSample() {
  const live = liveSession();
  const sampleSubjects = new Set(S().subjects.filter(x => x.sample).map(x => x.id));
  if (live && sampleSubjects.has(live.subjectId)) { toast('End the live session in the sample subject first.', 'error'); return; }
  const ok = await confirmDialog({ title: 'Remove sample data?', message: 'This removes every subject, student and session tagged Sample. Your own data is kept.', confirmLabel: 'Remove sample data', danger: true });
  if (!ok) return;
  const sampleStudents = new Set(S().students.filter(x => x.sample).map(x => x.id));
  S().subjects = S().subjects.filter(x => !x.sample);
  S().sessions = S().sessions.filter(x => !x.sample && !sampleSubjects.has(x.subjectId));
  S().students = S().students.filter(x => !x.sample);
  for (const st of S().students) st.subjectIds = st.subjectIds.filter(id => !sampleSubjects.has(id));
  for (const se of S().sessions) {
    for (const id of Object.keys(se.records)) if (sampleStudents.has(id)) delete se.records[id];
    for (const ev of se.events) if (sampleStudents.has(ev.sid)) ev.sid = null;
  }
  if (!subjectById(S().activeSubjectId)) S().activeSubjectId = S().subjects[0] ? S().subjects[0].id : null;
  Store.save();
  toast('Sample data removed.');
  render();
}

    const h = rows[0].map(x => x.toLowerCase());
    const idx = name => h.findIndex(x => x === name);
    if (idx('precision') >= 0 && idx('recall') >= 0) {
      const iM = idx('model'), iP = idx('precision'), iR = idx('recall'), i5 = idx('map@50'), i59 = idx('map@50-95'), iT = h.findIndex(x => x.startsWith('inference'));

      if (overall.length) { r.overall = overall; r.baselineName = overall[0].model; if (overall[1]) r.proposedName = overall[1].model; used++; }
    } else if (h.some(x => x.includes('baseline')) && h.some(x => x.includes('proposed'))) {

      if (perClass.length) { r.perClass = perClass; used++; }
    }

    const el = e.target;
    if (el.dataset.input === 'student-search') { App.studentQuery = el.value; renderStudentTable(); }
    else if (el.dataset.setting && el.type === 'range') onSettingChange(el, false);
  });
  window.addEventListener('hashchange', render);
  let resizeTimer = null;
  window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => Charts.draw(), 150); });
  window.addEventListener('pagehide', () => Store.flush());
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') Store.flush(); });
  if (darkQuery && darkQuery.addEventListener) darkQuery.addEventListener('change', () => { if (S().settings.theme === 'system') applyTheme(); });
}

/* ---------------- Rendering ---------------- */
function updateNav() {
  const nav = $('#nav');
  if (!nav) return;
  const live = liveSession();
  nav.innerHTML = NAV.map(n => {
    let badge = '';
    if (n.id === 'live') {
      if (live) badge = '<span class="nav-badge">Recording</span>';
      else if (Live.stream) badge = '<span class="nav-badge cam" title="The camera is on">Camera</span>';
    }
    const current = App.view === n.id || (App.view === 'session' && n.id === 'overview');
    return '<a href="#/' + n.id + '"' + (current ? ' aria-current="page"' : '') + '>' + ICON[n.icon] + '<span>' + n.label + '</span>' + badge + '</a>';
  }).join('');
  const p = S().profile;
  $('#who').innerHTML = p.name ? '<div>' + esc(p.name) + '</div><div class="muted">' + esc(p.department || 'Faculty') + '</div>' : '<a href="#/settings">Add your name</a>';
}
function renderSubjectPicker() {
  const wrap = $('#subject-picker');
  const sel = $('#subject-select');
  const hide = ['subjects', 'model', 'settings', 'session'].includes(App.view) || !S().subjects.length;
  wrap.hidden = hide;
  if (hide) return;
  const live = liveSession();
  const subs = S().subjects.slice().sort((a, b) => a.code.localeCompare(b.code, undefined, { numeric: true }));
  const active = activeSubject();
  sel.innerHTML = subs.map(s => '<option value="' + esc(s.id) + '"' + (active && s.id === active.id ? ' selected' : '') + '>' + esc(s.code + ' ' + s.name) + '</option>').join('');
  sel.disabled = App.view === 'live' && !!live;
  sel.title = sel.disabled ? 'End the live session to change the subject' : '';
}
function render() {
  const hash = location.hash.replace(/^#\/?/, '').split('/');
  const view = Views[hash[0]] ? hash[0] : 'overview';
  const param = hash[1] ? decodeURIComponent(hash[1]) : null;
  App.view = view;
  App.param = param;
  const v = Views[view];
  activeSubject();
  document.title = v.title + ' · ClassSight';
  $('#page-title').textContent = v.title;
  $('#page-sub').textContent = v.sub();
  updateNav();
  renderSubjectPicker();
  const page = $('#page');
  Live.park();
  Charts.slots = [];
  page.innerHTML = v.html(param);
  Charts.draw();
  if (v.mount) v.mount(param);
}

/* ---------------- Start ---------------- */
async function boot() {
  Store.load();
  applyTheme();
  Tip.init();
  wireEvents();
  render();
  if (Store.loadError) toast('Saved data could not be read, so the app started empty. A copy was kept in browser storage.', 'error');
  if (Store.blocked) toast('Browser storage is blocked, so nothing will be saved. Allow site data for this page.', 'error');
  await Model.init();
  refreshModelUI();
  if (App.view === 'live') Live.updateAll();
}
window.__classsight = { Store, Live, Model, FaceLib, decodeYolo, parseYoloShape, letterboxParams, descriptorDistance, normalizeState };
boot();
</script>
